<head>

  <title>Memedroid Legacy</title>
  <link rel="stylesheet" href="/legacy/css/legacy.css" type="text/css">
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png">
</head>
<body>
  <table id="bar" width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td width="48"><a href="/legacy/"><img src="/logo.jpg" width="40" height="40" alt="Memedroid"></a></td>
      <td>
        <h1>memedroid</h1>
        <p>Legacy · iOS 6 / 9.3.5</p>
      </td>
    </tr>
  </table>
  <div id="sub">
    <a href="/legacy/?g=trending">Trending</a>
    <a href="/legacy/?g=latest">Latest</a>
    <a href="/legacy/?g=top">Top</a>
    <a href="/legacy/?g=classics">Classics</a>

    <a href="/legacy/generate.html">Generate</a>

      Built for iPhone 4, iPad 2 and iOS 9.3.5. JPEG only, tables, XMLHttpRequest.
      Add to Home Screen from Safari.
    </div>
    <form class="row" action="/legacy/" method="get">
      <input type="hidden" name="g" value="trending">
      <input type="text" name="q" placeholder="Search memes">
